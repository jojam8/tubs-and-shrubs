backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "settings"
    label: "Site Content"
    files:

      - name: "general"
        label: "General Info"
        file: "content/site.json"
        fields:
          - { label: "Business Name", name: "business_name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Phone Number", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Areas Covered", name: "areas", widget: "string" }
          - { label: "About Paragraph 1", name: "about_1", widget: "text" }
          - { label: "About Paragraph 2", name: "about_2", widget: "text" }
          - { label: "Contact Intro Text", name: "contact_intro", widget: "text" }

      - name: "stock"
        label: "What's In Stock"
        file: "content/stock.json"
        fields:
          - label: "Stock Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "Plant Name", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Price", name: "price", widget: "string" }
